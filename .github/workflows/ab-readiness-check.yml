name: AB Readiness Check

on:
  pull_request:
    branches:
      - staging
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Номер PR для проверки"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  ab-readiness-check:
    name: ab-readiness-check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check workflow documentation
        run: |
          node .github/scripts/workflow-docs-check.mjs --self-test
          node .github/scripts/workflow-docs-check.mjs --check
          node .github/scripts/workflow-state-policy.mjs --self-test
          node .github/scripts/workflow-state-policy.mjs --check
          node .github/scripts/workflow-cycle-store.mjs --self-test
          node .github/scripts/workflow-spec-review-self-test.mjs
          node .github/scripts/workflow-spec-review-gates-self-test.mjs

      - name: Run self-test
        run: node .github/scripts/ab-readiness-check.mjs --self-test

      - name: Check PR readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: node .github/scripts/ab-readiness-check.mjs
