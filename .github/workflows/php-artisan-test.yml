name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          if-no-files-found: error

  phpunit-shard-coverage:
    name: phpunit-shard-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Verify PHPUnit shard coverage
        env:
          CI_TEST_SHARD_TOTAL: 4
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          CI_TEST_SHARD_INDEX=0 \
          CI_TEST_SHARD_TOTAL=1 \
          CI_TEST_SHARD_DRY_RUN=1 \
            bash scripts/ci-run-phpunit-shard.sh > "$tmpdir/all.raw"
          sed '/^Running PHPUnit shard /d' "$tmpdir/all.raw" > "$tmpdir/all.unsorted"
          sort "$tmpdir/all.unsorted" > "$tmpdir/all"

          for shard in 0 1 2 3; do
            CI_TEST_SHARD_INDEX="$shard" \
            CI_TEST_SHARD_TOTAL="$CI_TEST_SHARD_TOTAL" \
            CI_TEST_SHARD_DRY_RUN=1 \
              bash scripts/ci-run-phpunit-shard.sh > "$tmpdir/shard-$shard.raw"
            sed '/^Running PHPUnit shard /d' "$tmpdir/shard-$shard.raw" >> "$tmpdir/combined"
          done

          sort "$tmpdir/combined" > "$tmpdir/combined.sorted"
          sort "$tmpdir/combined" | uniq -d > "$tmpdir/duplicates"
          comm -23 "$tmpdir/all" "$tmpdir/combined.sorted" > "$tmpdir/missing"
          comm -13 "$tmpdir/all" "$tmpdir/combined.sorted" > "$tmpdir/extra"

          if [ -s "$tmpdir/missing" ] || [ -s "$tmpdir/extra" ] || [ -s "$tmpdir/duplicates" ]; then
            echo "PHPUnit shard coverage mismatch" >&2
            echo "Missing files:" >&2
            cat "$tmpdir/missing" >&2
            echo "Extra files:" >&2
            cat "$tmpdir/extra" >&2
            echo "Duplicate files:" >&2
            cat "$tmpdir/duplicates" >&2
            exit 1
          fi

          echo "PHPUnit shard coverage ok: $(wc -l < "$tmpdir/all") files"

  phpunit-shards:
    name: phpunit-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - frontend-build
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        total: [4]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: abrikosoff_connector_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d abrikosoff_connector_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: true
      CACHE_STORE: array
      MAIL_MAILER: array
      PULSE_ENABLED: false
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      TELESCOPE_ENABLED: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: abrikosoff_connector_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      GEMINI_API_KEY: test-key
      YANDEX_GEOCODER_API_KEY: test-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build

      - name: Run CI test suite
        env:
          CI_TEST_SHARD_INDEX: ${{ matrix.shard }}
          CI_TEST_SHARD_TOTAL: ${{ matrix.total }}
        run: bash scripts/ci-run-phpunit-shard.sh

  php-artisan-test:
    name: php-artisan-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - frontend-build
      - phpunit-shard-coverage
      - phpunit-shards
    if: ${{ always() }}

    steps:
      - name: Check required CI jobs
        run: |
          if [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "frontend-build failed or did not complete successfully" >&2
            exit 1
          fi

          if [ "${{ needs.phpunit-shard-coverage.result }}" != "success" ]; then
            echo "phpunit-shard-coverage failed or did not complete successfully" >&2
            exit 1
          fi

          if [ "${{ needs.phpunit-shards.result }}" != "success" ]; then
            echo "phpunit-shards failed or did not complete successfully" >&2
            exit 1
          fi
