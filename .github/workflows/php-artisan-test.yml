name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  determine-ci-scope:
    name: determine-ci-scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      scope: ${{ steps.ci-scope.outputs.scope }}
      run_php_tests: ${{ steps.ci-scope.outputs.run_php_tests }}
      reason: ${{ steps.ci-scope.outputs.reason }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine CI scope
        id: ci-scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if ! git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- > /tmp/changed-files.txt; then
              echo "Unable to determine changed files; falling back to the full Laravel suite."
              : > /tmp/changed-files.txt
            fi
          else
            printf "__runtime_push__\n" > /tmp/changed-files.txt
          fi

          node .github/scripts/ci-change-scope.mjs /tmp/changed-files.txt

  frontend-build:
    name: frontend-build
    needs:
      - determine-ci-scope
    if: needs.determine-ci-scope.outputs.run_php_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          if-no-files-found: error

  php-minimum-platform:
    name: php-minimum-platform
    needs:
      - determine-ci-scope
    if: needs.determine-ci-scope.outputs.run_php_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Verify minimum PHP platform
        run: composer check-platform-reqs

      - name: Verify generated Filament assets
        run: git diff --exit-code -- public/css/filament public/js/filament

  phpunit-shard-coverage:
    name: phpunit-shard-coverage
    needs:
      - determine-ci-scope
    if: needs.determine-ci-scope.outputs.run_php_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Verify PHPUnit shard coverage
        env:
          CI_TEST_SHARD_TOTAL: 4
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          CI_TEST_SHARD_INDEX=0 \
          CI_TEST_SHARD_TOTAL=1 \
          CI_TEST_SHARD_DRY_RUN=1 \
            bash scripts/ci-run-phpunit-shard.sh > "$tmpdir/all.raw"
          sed '/^Running PHPUnit shard /d' "$tmpdir/all.raw" > "$tmpdir/all.unsorted"
          sort "$tmpdir/all.unsorted" > "$tmpdir/all"

          for shard in 0 1 2 3; do
            CI_TEST_SHARD_INDEX="$shard" \
            CI_TEST_SHARD_TOTAL="$CI_TEST_SHARD_TOTAL" \
            CI_TEST_SHARD_DRY_RUN=1 \
              bash scripts/ci-run-phpunit-shard.sh > "$tmpdir/shard-$shard.raw"
            sed '/^Running PHPUnit shard /d' "$tmpdir/shard-$shard.raw" >> "$tmpdir/combined"
          done

          sort "$tmpdir/combined" > "$tmpdir/combined.sorted"
          sort "$tmpdir/combined" | uniq -d > "$tmpdir/duplicates"
          comm -23 "$tmpdir/all" "$tmpdir/combined.sorted" > "$tmpdir/missing"
          comm -13 "$tmpdir/all" "$tmpdir/combined.sorted" > "$tmpdir/extra"

          if [ -s "$tmpdir/missing" ] || [ -s "$tmpdir/extra" ] || [ -s "$tmpdir/duplicates" ]; then
            echo "PHPUnit shard coverage mismatch" >&2
            echo "Missing files:" >&2
            cat "$tmpdir/missing" >&2
            echo "Extra files:" >&2
            cat "$tmpdir/extra" >&2
            echo "Duplicate files:" >&2
            cat "$tmpdir/duplicates" >&2
            exit 1
          fi

          echo "PHPUnit shard coverage ok: $(wc -l < "$tmpdir/all") files"

  phpunit-shards:
    name: phpunit-shard-${{ matrix.shard }}
    needs:
      - determine-ci-scope
      - frontend-build
    if: needs.determine-ci-scope.outputs.run_php_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        total: [4]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: abrikosoff_connector_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d abrikosoff_connector_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: true
      CACHE_STORE: array
      MAIL_MAILER: array
      PULSE_ENABLED: false
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      TELESCOPE_ENABLED: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: abrikosoff_connector_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      GEMINI_API_KEY: test-key
      YANDEX_GEOCODER_API_KEY: test-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build

      - name: Run CI test suite
        env:
          CI_TEST_SHARD_INDEX: ${{ matrix.shard }}
          CI_TEST_SHARD_TOTAL: ${{ matrix.total }}
        run: bash scripts/ci-run-phpunit-shard.sh

  php-artisan-test:
    name: php-artisan-test
    needs:
      - determine-ci-scope
      - frontend-build
      - php-minimum-platform
      - phpunit-shard-coverage
      - phpunit-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Complete required check
        env:
          SCOPE_RESULT: ${{ needs.determine-ci-scope.result }}
          FRONTEND_RESULT: ${{ needs.frontend-build.result }}
          MINIMUM_PLATFORM_RESULT: ${{ needs.php-minimum-platform.result }}
          COVERAGE_RESULT: ${{ needs.phpunit-shard-coverage.result }}
          SHARDS_RESULT: ${{ needs.phpunit-shards.result }}
          RUN_PHP_TESTS: ${{ needs.determine-ci-scope.outputs.run_php_tests }}
          SCOPE: ${{ needs.determine-ci-scope.outputs.scope }}
          REASON: ${{ needs.determine-ci-scope.outputs.reason }}
        run: |
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "CI scope detection failed."
            exit 1
          fi

          if [ "$RUN_PHP_TESTS" = "true" ]; then
            if [ "$FRONTEND_RESULT" != "success" ]; then
              echo "frontend-build result: $FRONTEND_RESULT"
              exit 1
            fi

            if [ "$MINIMUM_PLATFORM_RESULT" != "success" ]; then
              echo "php-minimum-platform result: $MINIMUM_PLATFORM_RESULT"
              exit 1
            fi

            if [ "$COVERAGE_RESULT" != "success" ]; then
              echo "phpunit-shard-coverage result: $COVERAGE_RESULT"
              exit 1
            fi

            if [ "$SHARDS_RESULT" != "success" ]; then
              echo "phpunit-shards result: $SHARDS_RESULT"
              exit 1
            fi

            echo "Laravel shard suite passed."
            exit 0
          fi

          if [ "$RUN_PHP_TESTS" != "false" ]; then
            echo "Unexpected run_php_tests value: $RUN_PHP_TESTS"
            exit 1
          fi

          echo "Scope: $SCOPE"
          echo "Reason: $REASON"
          echo "Laravel suite skipped for docs/process-only changes."
