name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-artisan-test:
    name: php-artisan-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: abrikosoff_connector_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d abrikosoff_connector_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: true
      CACHE_STORE: array
      MAIL_MAILER: array
      PULSE_ENABLED: false
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      TELESCOPE_ENABLED: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: abrikosoff_connector_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      GEMINI_API_KEY: test-key
      YANDEX_GEOCODER_API_KEY: test-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine CI scope
        id: ci-scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/changed-files.txt
          else
            printf "__runtime_push__\n" > /tmp/changed-files.txt
          fi

          node .github/scripts/ci-change-scope.mjs /tmp/changed-files.txt

      - name: Skip Laravel suite for docs/process-only changes
        if: steps.ci-scope.outputs.run_php_tests == 'false'
        run: |
          echo "Scope: ${{ steps.ci-scope.outputs.scope }}"
          echo "Reason: ${{ steps.ci-scope.outputs.reason }}"

      - name: Setup PHP
        if: steps.ci-scope.outputs.run_php_tests == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql

      - name: Setup Node.js
        if: steps.ci-scope.outputs.run_php_tests == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        if: steps.ci-scope.outputs.run_php_tests == 'true'
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install npm dependencies
        if: steps.ci-scope.outputs.run_php_tests == 'true'
        run: npm ci

      - name: Build frontend assets
        if: steps.ci-scope.outputs.run_php_tests == 'true'
        run: npm run build

      - name: Run CI test suite
        if: steps.ci-scope.outputs.run_php_tests == 'true'
        run: composer test:ci
