name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  determine-ci-scope:
    name: determine-ci-scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      scope: ${{ steps.ci-scope.outputs.scope }}
      run_php_tests: ${{ steps.ci-scope.outputs.run_php_tests }}
      reason: ${{ steps.ci-scope.outputs.reason }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine CI scope
        id: ci-scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if ! git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- > /tmp/changed-files.txt; then
              echo "Unable to determine changed files; falling back to the full Laravel suite."
              : > /tmp/changed-files.txt
            fi
          else
            printf "__runtime_push__\n" > /tmp/changed-files.txt
          fi

          node .github/scripts/ci-change-scope.mjs /tmp/changed-files.txt

  laravel-suite:
    name: Laravel suite
    needs: determine-ci-scope
    if: needs.determine-ci-scope.outputs.run_php_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: abrikosoff_connector_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d abrikosoff_connector_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: true
      CACHE_STORE: array
      MAIL_MAILER: array
      PULSE_ENABLED: false
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      TELESCOPE_ENABLED: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: abrikosoff_connector_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      GEMINI_API_KEY: test-key
      YANDEX_GEOCODER_API_KEY: test-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run CI test suite
        run: composer test:ci

  php-artisan-test:
    name: php-artisan-test
    needs:
      - determine-ci-scope
      - laravel-suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Complete required check
        env:
          SCOPE_RESULT: ${{ needs.determine-ci-scope.result }}
          LARAVEL_RESULT: ${{ needs.laravel-suite.result }}
          RUN_PHP_TESTS: ${{ needs.determine-ci-scope.outputs.run_php_tests }}
          SCOPE: ${{ needs.determine-ci-scope.outputs.scope }}
          REASON: ${{ needs.determine-ci-scope.outputs.reason }}
        run: |
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "CI scope detection failed."
            exit 1
          fi

          if [ "$RUN_PHP_TESTS" = "true" ]; then
            if [ "$LARAVEL_RESULT" != "success" ]; then
              echo "Laravel suite result: $LARAVEL_RESULT"
              exit 1
            fi

            echo "Laravel suite passed."
            exit 0
          fi

          if [ "$RUN_PHP_TESTS" != "false" ]; then
            echo "Unexpected run_php_tests value: $RUN_PHP_TESTS"
            exit 1
          fi

          echo "Scope: $SCOPE"
          echo "Reason: $REASON"
          echo "Laravel suite skipped for docs/process-only changes."
