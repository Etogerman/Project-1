name: Production Post-Deploy Smoke

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Expected deployed commit SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: post-deploy-smoke-production
  cancel-in-progress: false

jobs:
  playwright-smoke:
    name: post-deploy-smoke (production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production

    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      RELEASE_REF: ${{ inputs.release_ref }}
      PLAYWRIGHT_EXPECTED_APP_REV: ${{ inputs.release_ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Validate environment secrets
        run: |
          set -euo pipefail

          for name in PLAYWRIGHT_BASE_URL PLAYWRIGHT_ADMIN_EMAIL PLAYWRIGHT_ADMIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          done

      - name: Log release context
        run: |
          echo "Production smoke for ref: ${RELEASE_REF:-not-provided}"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Wait for deployed app
        run: |
          set -euo pipefail

          readiness_url="${PLAYWRIGHT_BASE_URL%/}/admin/login"

          for attempt in $(seq 1 60); do
            status_code="$(curl -sS -o /dev/null -w '%{http_code}' "${readiness_url}" || true)"

            if [ "${status_code}" = "200" ]; then
              echo "App is ready at ${readiness_url}"
              exit 0
            fi

            echo "Attempt ${attempt}/60: ${readiness_url} returned ${status_code:-unreachable}"
            sleep 10
          done

          echo "::error::Timed out waiting for ${readiness_url}"
          exit 1

      - name: Verify deployed revision
        run: npx playwright test e2e/release-rev.smoke.spec.ts

      - name: Run public smoke
        run: npx playwright test e2e/public.smoke.spec.ts

      - name: Run admin smoke
        run: npx playwright test e2e/admin.smoke.spec.ts

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-smoke-production
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
