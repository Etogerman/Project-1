name: abrikosoff-connector

services:
  dev:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    command: composer dev
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "172.17.0.1:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - web
      - db
    tty: true
    stdin_open: true

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: abrikosoff_connector
      POSTGRES_USER: abrikosoff
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
      - .devcontainer/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "abrikosoff", "-d", "abrikosoff_connector"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command:
      - 'redis-server'
      - '--requirepass redispassword'
    volumes:
      - redis:/data
    networks:
      - db
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.23.2
    volumes:
      - mailpit:/data
    ports:
      - "8025:8025"
    expose:
      - "1025"
    networks:
      - web

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db
      - web

  ngrok:
    image: ngrok/ngrok:latest
    command: http http://dev:8000
    env_file:
      - path: .env
        required: false
      - path: .env.ngrok
        required: false
    ports:
      - "4040:4040"
    networks:
      - web
    depends_on:
      - dev

networks:
  web:
    driver: bridge
  db:
    driver: bridge

volumes:
  db:
    driver: local
  redis:
    driver: local
  mailpit:
    driver: local
