name: abrikosoff-connector

services:
  dev:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    command: composer dev
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "172.17.0.1:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - web
      - db
    tty: true
    stdin_open: true

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: abrikosoff_connector
      POSTGRES_USER: abrikosoff
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
      - .devcontainer/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "abrikosoff", "-d", "abrikosoff_connector"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command:
      - 'redis-server'
      - '--requirepass redispassword'
    volumes:
      - redis:/data
    networks:
      - db
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.23.2
    volumes:
      - mailpit:/data
    ports:
      - "8025:8025"
    expose:
      - "1025"
    networks:
      - web

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db
      - web

  ngrok:
    image: ngrok/ngrok:latest
    command: http http://dev:8000
    env_file:
      - path: .env
        required: false
      - path: .env.ngrok
        required: false
    ports:
      - "4040:4040"
    networks:
      - web
    depends_on:
      - dev

  telegram-bot-api:
    profiles:
      - telegram-local-bot-api
    build:
      context: .devcontainer/telegram-bot-api
      args:
        TELEGRAM_BOT_API_COMMIT: adfd7f6a8e990272851777eeb3ae0def4216f161
    env_file:
      - path: .env.telegram-bot-api
        required: true
    command:
      - --local
      - --http-ip-address=0.0.0.0
      - --http-port=8081
      - --dir=/var/www/html/storage/app/telegram-bot-api
      - --temp-dir=/var/www/html/storage/app/telegram-bot-api/tmp
    volumes:
      - ./storage/app/telegram-bot-api:/var/www/html/storage/app/telegram-bot-api
    expose:
      - "8081"
    networks:
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  telegram-bot-api-file-bridge:
    profiles:
      - telegram-local-bot-api
    build:
      context: .devcontainer/telegram-bot-api-file-bridge
    env_file:
      - path: .env.telegram-bot-api-file-bridge
        required: true
    volumes:
      - ./storage/app/telegram-bot-api:/var/lib/telegram-bot-api:ro
    expose:
      - "8082"
    networks:
      - web
    restart: unless-stopped
    depends_on:
      telegram-bot-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

networks:
  web:
    driver: bridge
  db:
    driver: bridge

volumes:
  db:
    driver: local
  redis:
    driver: local
  mailpit:
    driver: local
