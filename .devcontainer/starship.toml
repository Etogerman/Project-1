# Starship Configuration - Minimal Setup
# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Format - minimal: just directory, branch, and git status
format = """
$directory$git_branch$git_status
$character"""

# Timeout for commands executed by starship (in milliseconds)
command_timeout = 1000

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"

[username]
disabled = true

[hostname]
disabled = true

[directory]
truncation_length = 3
truncate_to_repo = true
format = "in [$path]($style)[$read_only]($read_only_style) "
style = "bold blue"
read_only = " 🔒"
read_only_style = "red"

[git_branch]
symbol = " "
format = "on [$symbol$branch(:$remote_branch)]($style) "
style = "bold yellow"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = "✓"
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[php]
disabled = true

[nodejs]
disabled = true

[docker_context]
disabled = true

[cmd_duration]
min_time = 500
format = "took [$duration](bold yellow) "

[time]
disabled = false
format = '🕙[\[ $time \]]($style) '
time_format = "%T"
style = "bold white"

[memory_usage]
disabled = false
threshold = 75
symbol = " "
format = "$symbol[$ram_pct]($style) "
style = "bold dimmed white"

[package]
symbol = " "
format = "is [$symbol$version]($style) "
