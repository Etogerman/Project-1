server {
    listen 8082;
    server_name _;
    server_tokens off;

    access_log off;
    error_log /dev/stderr crit;

    location = /healthz {
        auth_basic off;
        return 204;
    }

    location /api/ {
        auth_basic "Telegram Local Bot API";
        auth_basic_user_file /etc/nginx/.telegram-bot-api-files.htpasswd;

        proxy_pass http://telegram-bot-api:8081/;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 21600s;
        client_max_body_size 0;

        limit_except GET POST {
            deny all;
        }
    }

    location ~ ^/files/(?<telegram_media_path>(?:[^/]+/)?(?:animations|documents|music|photos|profile_photos|stickers|thumbnails|video_notes|videos|voice)/[^/]+)$ {
        auth_basic "Telegram Local Bot API media";
        auth_basic_user_file /etc/nginx/.telegram-bot-api-files.htpasswd;

        alias /var/lib/telegram-bot-api/$telegram_media_path;
        autoindex off;
        disable_symlinks on;
        log_not_found off;

        limit_except GET {
            deny all;
        }
    }

    location /files/ {
        return 404;
    }
}
